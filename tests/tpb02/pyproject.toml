[build-system]
requires = ["flit_core >=3,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "foo"
authors = [{name="Stefano Rivera"}]
dependencies = [
    "cachy",
    "importlib-metadata ; python_version < '3.5'"
]
dynamic = ["version", "description"]

[project.optional-dependencies]
test = [
    "tox",
]

[project.scripts]
foo = "foo:main"

[tool.flit.external-data]
directory = "data"
